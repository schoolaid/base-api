; Config for the integration tests in this directory, built with -tags integration and run against
; a throwaway MySQL/MariaDB database. beego reads conf/app.conf from the test's working directory:
;   BASEAPI_TEST_MYSQL_DSN  e.g. user:pass@tcp(127.0.0.1:3306)/baseapi_test  (the name must end in _test)
appname = base_api
runmode = test
secretKey = token-route-integration-test-only-key

[test]
db = ${BASEAPI_TEST_MYSQL_DSN}
secretKey = token-route-integration-test-only-key
